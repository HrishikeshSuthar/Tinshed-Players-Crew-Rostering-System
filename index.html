<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tinshed Players - Crew Rostering System</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="container">

  <h1>Tinshed Players</h1>
  <p class="subtitle">Crew Rostering System</p>

  <!-- VOLUNTEER MANAGEMENT -->
  <section>

    <h2>Add Volunteer</h2>

    <form id="volunteerForm">

      <label for="fullName">Full Name *</label>
      <input type="text" id="fullName"
             placeholder="Enter volunteer name" />

      <label for="phone">Phone Number *</label>
      <input type="tel" id="phone"
             placeholder="Enter phone number" />

      <label for="email">Email Address *</label>
      <input type="email" id="email"
             placeholder="Enter email address" />

      <label for="status">Status</label>
      <input type="text" id="status"
             value="Active" readonly />

      <p id="message"></p>

      <div class="buttons">
        <button type="submit">Save Volunteer</button>
        <button type="reset" class="cancel">Cancel</button>
      </div>

    </form>

    <div class="volunteer-list">

      <h3>Volunteer Records</h3>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="volunteerBody"></tbody>
      </table>

    </div>

  </section>


  <!-- REQUIRED CREW ROLES -->
  <section>

    <h2>Crew Role Management</h2>

    <form id="crewRoleForm">

      <label for="rolePerformance">Performance *</label>

      <select id="rolePerformance">
        <option value="">Select performance</option>
        <option value="Opening Night">Opening Night</option>
        <option value="Friday Evening">Friday Evening</option>
        <option value="Saturday Matinee">Saturday Matinee</option>
      </select>

      <label for="roleName">Crew Role Name *</label>

      <input type="text"
             id="roleName"
             placeholder="Enter crew role" />

      <p id="roleMessage"></p>

      <button type="submit">
        Add Required Crew Role
      </button>

    </form>

    <div class="role-list">

      <h3>Required Crew Roles</h3>

      <table>
        <thead>
          <tr>
            <th>Performance</th>
            <th>Crew Role</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="crewRoleBody"></tbody>
      </table>

    </div>

  </section>


  <!-- ASSIGN VOLUNTEER -->
  <section>

    <h2>Assign Volunteer to Crew Role</h2>

    <form id="assignmentForm">

      <label for="performance">Performance *</label>

      <select id="performance">
        <option value="">Select performance</option>
        <option value="Opening Night">Opening Night</option>
        <option value="Friday Evening">Friday Evening</option>
        <option value="Saturday Matinee">Saturday Matinee</option>
      </select>


      <label for="assignmentRole">Crew Role *</label>

      <select id="assignmentRole">
        <option value="">Select crew role</option>
        <option value="Stage Manager">Stage Manager</option>
        <option value="Lighting">Lighting</option>
        <option value="Sound">Sound</option>
        <option value="Front of House">Front of House</option>
      </select>


      <label for="volunteer">Volunteer *</label>

      <select id="volunteer">
        <option value="">Select volunteer</option>
        <option value="John Smith">John Smith</option>
        <option value="Sarah Brown">Sarah Brown</option>
        <option value="Michael Lee">Michael Lee</option>
      </select>

      <p id="assignmentMessage"></p>

      <button type="submit">
        Assign Volunteer
      </button>

    </form>

  </section>


  <!-- VIEW PERFORMANCE ROSTER -->
  <section>

    <h2>View Performance Roster</h2>

    <label for="rosterPerformance">
      Performance *
    </label>

    <select id="rosterPerformance">
      <option value="">Select performance</option>
      <option value="Opening Night">Opening Night</option>
      <option value="Friday Evening">Friday Evening</option>
      <option value="Saturday Matinee">Saturday Matinee</option>
    </select>

    <button type="button" id="viewRosterButton">
      View Roster
    </button>

    <p id="rosterMessage"></p>

    <div id="rosterResult">

      <table id="rosterTable" style="display: none;">

        <thead>
          <tr>
            <th>Performance</th>
            <th>Crew Role</th>
            <th>Volunteer</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="rosterBody"></tbody>

      </table>

    </div>

  </section>

</div>

<script src="script.js"></script>

</body>
</html>
